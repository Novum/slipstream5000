name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.configuration }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-24.04, macos-14]
        configuration: [debug, release]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install build tools
        run: python -m pip install meson ninja
      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Set up SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          version: 3-latest
          build-type: Release
          install-linux-dependencies: true
          add-to-environment: true
      - name: Configure
        env:
          PKG_CONFIG_PATH: ${{ steps.sdl.outputs.prefix }}/lib/pkgconfig
          CMAKE_PREFIX_PATH: ${{ steps.sdl.outputs.prefix }}
        run: meson setup build --buildtype=${{ matrix.configuration }} --cmake-prefix-path="${{ steps.sdl.outputs.prefix }}"
      - name: Build
        run: meson compile -C build
      - name: Copy Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem '${{ steps.sdl.outputs.prefix }}' -Filter SDL3.dll -Recurse | Select-Object -First 1
          if ($null -eq $dll) { throw 'SDL3.dll was not found' }
          Copy-Item -LiteralPath $dll.FullName -Destination build/SDL3.dll
      - name: Upload executable
        uses: actions/upload-artifact@v7
        with:
          name: slipstream5000-${{ runner.os }}-${{ matrix.configuration }}
          path: |
            build/slipstream5000
            build/slipstream5000.exe
            build/slipstream5000.pdb
            build/SDL3.dll
            LICENSE
            readme.md
            src/opal/LICENSE*
          if-no-files-found: error
