name: Formatting check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install formatters
        run: python -m pip install 'clang-format==22.1.3' 'meson==1.11.0'
      - name: Check formatting
        run: |
          clang-format --version
          find src/port -type f \( -name '*.c' -o -name '*.h' -o -name '*.inc' -o -name '*.glsl' -o -name '*.hlsl' -o -name '*.metal' \) -print0 | xargs -0 clang-format -i
          git diff --exit-code -- src/port
          meson format --check-only meson.build meson.options
          git diff --check
